# IKDDS Haemodialysis Audit — Metrics Registry
# Each entry defines a clinical metric for the dashboard engine.
# Used by metrics_registry() and compute_with_engine().

# --- Dialysis Adequacy ---

urr_achievement:
  title: "URR >65%"
  domain: dialysis
  type: proportion
  summary_stat: proportion
  compute_fn: compute_urr_achievement
  value_field: qblg9
  target: 0.65
  target_label: ">65%"
  unit: "%"
  numerator_desc: "Patients with URR >65%"
  denominator_desc: "Patients with URR recorded"
  suppression:
    min_n: 10
    min_completeness: 0.70
  plots:
    - caterpillar
    - funnel
  notes: "KDOQI target. Optional filter: 3x/week only."

urr_median:
  title: "URR Median"
  domain: dialysis
  type: median
  summary_stat: median
  compute_fn: compute_urr_median
  value_field: qblg9
  target: 65
  target_label: "65%"
  unit: "%"
  numerator_desc: ~
  denominator_desc: "Patients with URR recorded"
  suppression:
    min_n: 10
    min_completeness: 0.70
  plots:
    - caterpillar
  notes: "Median URR by centre."

# --- Blood Pressure ---

pre_bp_achievement:
  title: "Pre-HD BP <140/90"
  domain: bp
  type: proportion
  compute_fn: compute_pre_bp_achievement
  value_field: qblg3
  target: ~
  target_label: "<140/90 mmHg"
  unit: "%"
  numerator_desc: "Patients with pre-HD SBP <140 AND DBP <90"
  denominator_desc: "Patients with pre-HD BP recorded"
  suppression:
    min_n: 10
    min_completeness: 0.70
  plots:
    - caterpillar
    - funnel
  notes: "Requires both SBP (qblg3) and DBP (qblg4)."

post_bp_achievement:
  title: "Post-HD BP <130/80"
  domain: bp
  type: proportion
  compute_fn: compute_post_bp_achievement
  value_field: qblg6
  target: ~
  target_label: "<130/80 mmHg"
  unit: "%"
  numerator_desc: "Patients with post-HD SBP <130 AND DBP <80"
  denominator_desc: "Patients with post-HD BP recorded"
  suppression:
    min_n: 10
    min_completeness: 0.70
  plots:
    - caterpillar
    - funnel
  notes: "Requires both SBP (qblg6) and DBP (qblg7)."

